server.port=8082
spring.application.name=gateway

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Routes : lb:// = load-balanced via Eureka (le nom correspond au spring.application.name)
spring.cloud.gateway.routes[0].id=commande-api
spring.cloud.gateway.routes[0].uri=lb://commande
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/commandes/**

spring.cloud.gateway.routes[1].id=commande-data-rest
spring.cloud.gateway.routes[1].uri=lb://commande
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/data-rest/commandes/**

spring.cloud.gateway.routes[2].id=stock-api
spring.cloud.gateway.routes[2].uri=lb://stock
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/produits/**

spring.cloud.gateway.routes[3].id=stock-data-rest
spring.cloud.gateway.routes[3].uri=lb://stock
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/data-rest/produitEnStocks/**

# Tout le reste (IHM) vers commande
spring.cloud.gateway.routes[4].id=ihm
spring.cloud.gateway.routes[4].uri=lb://commande
spring.cloud.gateway.routes[4].predicates[0]=Path=/**
