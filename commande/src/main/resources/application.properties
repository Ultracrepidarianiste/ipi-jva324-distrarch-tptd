logging.level.com.ipi.jva324.commande=DEBUG
server.port=8080
spring.application.name=commande

# Base de donnees :
spring.jpa.hibernate.ddl-auto=update
# H2 en memoire (defaut) :
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:db;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=sa

# Spring Data REST - expose les repositories en HAL
spring.data.rest.base-path=/api/data-rest

# URL du microservice stock (utilisee par CommandeProduitServiceRESTImpl)
stock.service.url=http://localhost:8081

# Eureka - enregistrement aupres du Discovery Service
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Web :
spring.mvc.format.date=iso
spring.web.resources.static-locations=classpath:/META-INF/resources/, classpath:/resources/, classpath:/static/, classpath:/public/, classpath:/templates/
spring.thymeleaf.cache=false
